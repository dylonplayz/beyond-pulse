<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071421">
  <meta name="description" content="Beyond Pulse — Maya's simulated mission health dashboard.">
  <title>Beyond Pulse | Maya's Mission Health</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Main navigation">
      <a class="brand" href="#today" aria-label="Beyond Pulse home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 22h7l4-10 7 18 4-9h8"/><circle cx="20" cy="20" r="17"/></svg></span>
        <span><b>BEYOND</b><strong>PULSE</strong><small>CREW HEALTH SYSTEM</small></span>
      </a>
      <div class="rail-label">MISSION CONTROL</div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="today"><span class="nav-icon">◉</span><span>Home</span><small class="nav-count">01</small></button>
        <button class="nav-item" data-view="trends"><span class="nav-icon">⌁</span><span>Trends</span></button>
        <button class="nav-item" data-view="checkin"><span class="nav-icon">＋</span><span>Wellness</span></button>
        <button class="nav-item" data-view="bone"><span class="nav-icon">⌬</span><span>Body health</span></button>
        <button class="nav-item" data-view="radiation"><span class="nav-icon">✳</span><span>Environment</span></button>
        <button class="nav-item" data-view="routine"><span class="nav-icon">▦</span><span>Daily plan</span><span id="routine-count" class="count-badge">2</span></button>
        <button class="nav-item" data-view="care"><span class="nav-icon">↗</span><span>Medical support</span></button>
      </nav>
      <div class="rail-bottom">
        <div class="privacy-note"><span class="lock-icon">◇</span><div><b>ON-DEVICE WORKSPACE</b><small>Private records stay in this browser</small></div></div>
        <div class="rail-profile"><span class="avatar">M</span><div><b>Maya</b><small>Crew health profile</small></div></div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="crumb"><span>CREW HEALTH</span><i>/</i><b id="page-crumb">HOME</b></div>
        <div class="top-actions">
          <span class="mission-chip"><span class="pulse-dot"></span> MAYA <i>·</i> MISSION SIMULATION</span>
          <button class="icon-button" id="help-button" aria-label="About this prototype">i</button>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
      <footer class="global-footer"><span>BEYOND PULSE <i>·</i> MAYA'S MISSION HEALTH</span><span><span class="footer-dot"></span> SIMULATION MODE <i>·</i> SOURCE-LABELED</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div class="modal-inner"><button class="modal-close" id="modal-close" aria-label="Close">×</button><div id="modal-body"></div></div></dialog>
  <script src="app.js"></script>
</body>
</html>
